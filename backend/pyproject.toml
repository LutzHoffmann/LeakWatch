[project]
name = "leakwatch"
version = "0.1.0"
description = "LeakWatch — Credential Leak Monitor. Watches paste sites, Telegram channels and public leak dumps for your domains and emails."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "LeakWatch" }]
keywords = ["security", "leak-monitor", "credentials", "osint", "llm"]

dependencies = [
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "arq>=0.26.0",
    "redis>=5.0.4",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
    "resend>=2.4.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.1"]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "anyio>=4.3.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
leakwatch = "leakwatch.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leakwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC", "S", "PL"]
ignore = ["S101", "S104", "PLR2004", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004", "B017"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*", "resend.*", "bs4.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=leakwatch --cov-report=term-missing --cov-fail-under=80"
markers = [
    "live: tests that call a real LLM API (skipped unless LLM_API_KEY is set)",
]

[tool.coverage.run]
source = ["src/leakwatch"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
